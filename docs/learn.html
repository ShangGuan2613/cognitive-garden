<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>地图 · 认知园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="learn-shell-retained.css">
<link rel="stylesheet" href="garden-theme.css">
<style>
:root{--accent:#DC2626;--bg:#FFF7ED;--text:#000;--sub:#44403C;--sidebar-w:300px}
body{background:var(--bg);color:var(--text);margin:0}
.layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:calc(100vh - 52px)}
.sidebar{border-right:1px solid rgba(0,0,0,.12);overflow:auto;background:var(--bg)}
.nav-tree{padding:12px 10px 40px}
.part-divider{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#78716C;padding:14px 8px 6px}
.topic-head{font-weight:800;font-size:14px;padding:8px}
.lesson-item{display:block;padding:8px 10px;margin:2px 4px;border-radius:2px;text-decoration:none;color:var(--text);font-size:13.5px;line-height:1.35;border-left:2px solid transparent}
.lesson-item:hover{background:rgba(0,0,0,.04)}
.lesson-item.active{border-left-color:var(--accent);background:#FEE2E2;font-weight:700}
.lesson-item .desc{display:block;color:var(--sub);font-weight:400;font-size:12px;margin-top:2px}
.frame-wrap{display:flex;flex-direction:column;min-width:0}
.frame-wrap iframe{flex:1;width:100%;border:0;background:#fff;min-height:70vh}
.bottom-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid rgba(0,0,0,.12)}
.bottom-bar button{border:1px solid rgba(0,0,0,.15);background:transparent;padding:8px 12px;border-radius:2px;cursor:pointer;font-size:13px}
.bottom-bar .grow{flex:1;text-align:center;font-size:13px;color:var(--sub)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{max-height:40vh;border-right:0;border-bottom:1px solid rgba(0,0,0,.12)}}
</style></head><body>
<header class="topnav"><a class="brand" href="home.html">认知<span>园</span></a><nav><a href="home.html">首页</a><a href="learn.html" class="active">地图</a><a href="now.html">此刻</a><a href="log.html">日志</a><a href="about.html">关于</a></nav><span class="spacer"></span><button type="button" id="themeBtn" class="mono" style="border:1px solid var(--border);background:transparent;padding:4px 10px;border-radius:2px;cursor:pointer;font-size:12px;color:var(--sub)">主题</button></header>
<div class="layout">
<aside class="sidebar"><nav class="nav-tree" id="navTree"></nav></aside>
<div class="frame-wrap">
<iframe id="lessonFrame" title="笔记内容"></iframe>
<div class="bottom-bar">
<button type="button" id="prevBtn">← 上一点</button>
<div class="grow" id="posLabel"></div>
<button type="button" id="nextBtn">下一点 →</button>
</div></div></div>
<script src="course-data.js"></script>
<script>
(function(){
  var flat=window.COURSE_FLAT||[];
  var tree=document.getElementById('navTree');
  var iframe=document.getElementById('lessonFrame');
  var idx=0;
  function renderTree(){
    var html='';
    (window.COURSE.parts||[]).forEach(function(part){
      html+='<div class="part-divider">'+part.num+' · '+part.title+'</div>';
      part.topics.forEach(function(topic){
        html+='<div class="topic-head">'+topic.title+'</div>';
        topic.lessons.forEach(function(les){
          var i=flat.findIndex(function(x){return x.file===les.file});
          var ex=les.example?' <span class="example-badge">示例</span>':'';
          html+='<a class="lesson-item" data-i="'+i+'" href="#'+les.file+'"><span>'+les.title+ex+'</span><span class="desc">'+(les.claim||les.desc||'')+'</span></a>';
        });
      });
    });
    tree.innerHTML=html;
    tree.querySelectorAll('.lesson-item').forEach(function(a){
      a.addEventListener('click',function(e){e.preventDefault();load(+a.getAttribute('data-i'));});
    });
  }
  function load(i){
    if(!flat.length)return;
    if(i<0)i=0;if(i>=flat.length)i=flat.length-1;
    idx=i; var les=flat[idx];
    iframe.src=les.file; location.hash=les.file;
    tree.querySelectorAll('.lesson-item').forEach(function(a){a.classList.toggle('active',+a.getAttribute('data-i')===idx);});
    document.getElementById('posLabel').textContent=(idx+1)+' / '+flat.length+' · '+les.title;
    document.getElementById('prevBtn').disabled=idx===0;
    document.getElementById('nextBtn').disabled=idx===flat.length-1;
  }
  document.getElementById('prevBtn').onclick=function(){load(idx-1)};
  document.getElementById('nextBtn').onclick=function(){load(idx+1)};
  renderTree();
  var h=(location.hash||'').replace(/^#/,'');
  var start=h?flat.findIndex(function(x){return x.file===h}):0;
  load(start<0?0:start);
})();
</script>
<script>(function(){var btn=document.getElementById('themeBtn');function apply(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('garden_theme',t)}catch(e){}}var cur='light';try{cur=localStorage.getItem('garden_theme')||'light'}catch(e){}apply(cur);if(btn)btn.onclick=function(){apply(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')};})();</script>
</body></html>
